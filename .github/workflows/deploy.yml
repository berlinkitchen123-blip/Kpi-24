name: Deploy

# Push to main -> build web app + functions -> deploy hosting, rules, functions.
# Needs one GitHub secret (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT  = JSON of the Firebase service account key (never commit it)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix functions

      - name: Build web app
        # Firebase web config comes from .env.production (public values, safe to commit)
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx --yes firebase-tools@latest deploy --project "kpi-24" --only hosting,firestore,storage,functions --non-interactive --force
